[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credential-sharing"
version = "2.0.0"
description = "Privacy-preserving selective disclosure and revocation of academic credentials (W3C VC/DID, Merkle proofs, X.509, simulated permissioned ledger)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Salvatore Francesco Tartaglione" },
  { name = "Christian Rosa" },
]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
bench = ["matplotlib>=3.7"]

[project.scripts]
credential-sharing = "credential_sharing.cli:main"

[tool.setuptools.packages.find]
include = ["credential_sharing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "SLF001"]
"credential_sharing/sample_data.py" = ["S105"]
